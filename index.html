</style></head><body><div id="intro"><div id="card"><h1>BLACK R8 V10 SPYDER</h1><p>Interaktives 3D-Cockpit · schwarzer Spyder · VR-Unterstützung</p><p>Tippe auf Start, um einzusteigen. Am besten im Meta-Quest-Browser öffnen und danach VR starten.</p><button id="start">Einsteigen</button></div></div><div id="hud"><div id="brand">BLACK R8 V10 SPYDER · VR COCKPIT</div><div id="hint">Blick bewegen · Motor starten · VR-Modus</div><div id="controls"><button id="engine">🔑 Motor starten</button><button id="reset">◎ Ansicht zurücksetzen</button><button id="vr">🥽 VR-Modus starten</button></div></div><div id="toast"></div>

function seat(parent,x,z){let leather=mat(0x17191d,.8),stitch=mat(0x6f2228,.7);let s=new THREE.Group();s.position.set(x,0,z);parent.add(s);box(s,.56,.12,.62,0,.53,0,leather,-.08,0,0);box(s,.56,.65,.16,0,.88,-.23,leather,-.12,0,0);box(s,.12,.58,.18,-.25,.85,-.2,leather,-.12,0,-.1);box(s,.12,.58,.18,.25,.85,-.2,leather,-.12,0,.1);box(s,.24,.2,.13,0,1.22,-.27,leather);curveTube(s,[[-.19,.59,.31],[-.19,.8,.31],[-.15,1.1,.0],[-.1,1.15,-.05]],.008,stitch);curveTube(s,[[.19,.59,.31],[.19,.8,.31],[.15,1.1,.0],[.1,1.15,-.05]],.008,stitch);return s}
function makeCar(){carGroup=new THREE.Group();scene.add(carGroup);const paint=mat(0x090b0f,.19,.82),black=mat(0x050608,.32,.55),glass= new THREE.MeshPhysicalMaterial({color:0x15222a,metalness:.3,roughness:.12,transparent:true,opacity:.48}),leather=mat(0x17191d,.74),red=mat(0xc30d23,.28,.25),silver=mat(0xb4bac2,.24,.85),screen=mat(0x14242c,.24,.35),light=mat(0xe7f0ff,.2,.2),tail=mat(0xe20d24,.2,.2);

let hood=box(carGroup,1.72,.17,1.18,0,.69,-1.42,paint,-.02,0,0);hood.scale.set(1,.8,1);
box(carGroup,1.76,.25,1.05,0,.65,1.38,paint);

let steering=new THREE.Group();steering.position.set(-.5,1.08,-.72);steering.rotation.x=-.22;carGroup.add(steering);let tor=new THREE.Mesh(new THREE.TorusGeometry(.25,.035,12,48),black);steering.add(tor);box(steering,.11,.08,.08,0,0,0,red);box(steering,.045,.31,.04,0,-.12,0,black);box(steering,.31,.045,.04,0,-.02,0,black);
for(let i=0;i<3;i++){let dial=new THREE.Mesh(new THREE.CircleGeometry(.105,32),screen);dial.position.set(-.34+i*.19,1.04,-.94);carGroup.add(dial);let rim=new THREE.Mesh(new THREE.TorusGeometry(.107,.012,8,32),silver);rim.position.copy(dial.position);carGroup.add(rim);for(let j=0;j<8;j++){let a=j*Math.PI/4;box(carGroup,.008,.028,.008,dial.position.x+Math.sin(a)*.065,1.04+Math.cos(a)*.065,-.935,light)}}
// windshield and side glass as slanted panes
let wind=new THREE.Mesh(new THREE.BoxGeometry(1.65,.04,.9),glass);wind.position.set(0,1.22,-.92);wind.rotation.x=-.42;wind.castShadow=false;carGroup.add(wind);
for(let side of [-1,1]){let pane=new THREE.Mesh(new THREE.BoxGeometry(.04,.36,1.18),glass);pane.position.set(side*.89,1.06,-.1);pane.rotation.z=side*.09;carGroup.add(pane);}
// open top, roll hoops and rear vents

function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x9daab5);scene.fog=new THREE.Fog(0x9daab5,12,38);camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.05,100);camera.position.set(0,1.55,0.28);camera.rotation.order='YXZ';renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);

// villa facade

}
function engineSound(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();if(engineOn){if(gain)gain.gain.setTargetAtTime(0,audioCtx.currentTime,.15);engineOn=false;$('engine').textContent='🔑 Motor starten';return}engineOn=true;$('engine').textContent='⏹ Motor ausschalten';osc1=audioCtx.createOscillator();osc2=audioCtx.createOscillator();gain=audioCtx.createGain();let filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=420;osc1.type='sawtooth';osc2.type='triangle';osc1.frequency.setValueAtTime(95,audioCtx.currentTime);osc2.frequency.setValueAtTime(48,audioCtx.currentTime);osc1.frequency.exponentialRampToValueAtTime(155,audioCtx.currentTime+.5);osc1.frequency.exponentialRampToValueAtTime(86,audioCtx.currentTime+2.3);osc2.frequency.exponentialRampToValueAtTime(43,audioCtx.currentTime+2.3);gain.gain.setValueAtTime(.001,audioCtx.currentTime);gain.gain.linearRampToValueAtTime(.12,audioCtx.currentTime+.12);gain.gain.setTargetAtTime(.045,audioCtx.currentTime+1,.6);osc1.connect(filter);osc2.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc1.start();osc2.start();}catch(e){toast('Audio konnte nicht gestartet werden. Tippe erneut auf Motor starten.')}}
